<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Happy Birthday My Love ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  padding: 0;
  overflow: hidden;
  font-family: 'Great Vibes', cursive;
  text-align: center;
  color: white;
}

.slideshow {
  position: fixed;
  width: 100%;
  height: 100%;
  z-index: -2;
}

.slideshow img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  animation: fade 18s infinite;
  opacity: 0;
}

.slideshow img:nth-child(1) { animation-delay: 0s; }
.slideshow img:nth-child(2) { animation-delay: 6s; }
.slideshow img:nth-child(3) { animation-delay: 12s; }

@keyframes fade {
  0% {opacity: 0;}
  10% {opacity: 1;}
  30% {opacity: 1;}
  40% {opacity: 0;}
  100% {opacity: 0;}
}

.overlay {
  position: fixed;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.4);
  z-index: -1;
}

.content {
  position: relative;
  top: 35%;
  transform: translateY(-50%);
  animation: glow 2s infinite alternate;
}

h1 {
  font-size: 70px;
}

p {
  font-size: 35px;
}

@keyframes glow {
  from { text-shadow: 0 0 10px pink; }
  to { text-shadow: 0 0 25px red; }
}

button {
  margin-top: 30px;
  padding: 15px 30px;
  font-size: 20px;
  border: none;
  border-radius: 30px;
  background: pink;
  color: black;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  background: red;
  color: white;
}

/* Floating Hearts */
.heart {
  position: absolute;
  color: pink;
  font-size: 20px;
  animation: fall linear infinite;
}

@keyframes fall {
  0% { transform: translateY(-10vh); }
  100% { transform: translateY(110vh); }
}
</style>
</head>

<body>

<div class="slideshow">
  <img src="photo1.jpg">
  <img src="photo2.jpg">
  <img src="photo3.jpg">
</div>

<div class="overlay"></div>

<div class="content">
  <h1>Happy Birthday My Love ❤️</h1>
  <p>You are my forever & always 💕</p>
  <button onclick="playMusic()">Click Here My Love 💖</button>
</div>

<audio id="music" loop>
  <source src="song.mp3" type="audio/mp3">
</audio>

<script>
function playMusic(){
  document.getElementById("music").play();
}

// Create floating hearts
for(let i=0;i<30;i++){
  let heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random()*100 + "vw";
  heart.style.animationDuration = (3 + Math.random()*5) + "s";
  document.body.appendChild(heart);
}
</script>

</body>
</html>
